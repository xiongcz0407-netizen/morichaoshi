<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="末世超市">
<meta name="theme-color" content="#2b2620">
<title>末世超市</title>
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="labels"></div>
  <div id="joyzone"></div>
  <div id="hud" class="hidden">
    <div class="hl">
      <canvas id="hAvatar" class="avatar" width="72" height="72" data-open="menu"></canvas>
      <div class="chip coin"><i class="ico-coin"></i><b id="hCoins">0</b></div>
      <div class="chip"><span class="k">口碑</span><b id="hRep">0</b><span class="bar"><i id="hRepBar"></i></span></div>
      <div id="hGoal" class="goal" data-open="tasks"></div>
    </div>
    <div class="hc">
      <div class="chip bagchip"><span class="k">背包</span><b id="hBag">0/8</b><span class="bar"><i id="hBagBar"></i></span></div>
      <div id="hShort" class="short"></div>
    </div>
    <div class="hr">
      <button class="hb" data-open="stock">仓库</button>
      <button class="hb" data-open="build">建造<em id="hBuild"></em></button>
      <button class="hb" data-open="shelf">货架</button>
      <button class="hb menu" data-open="menu" aria-label="菜单">≡</button>
    </div>
  </div>
  <button id="farmBtn" class="fab hidden">种菜</button>
  <div id="toasts"></div>
  <div id="big"></div>
  <div id="flash"></div>
  <div id="panel" class="hidden"><div class="pbox" role="dialog"><header><h3 id="ptitle"></h3><button class="px" data-close>关闭</button></header><div class="pbody" id="pbody"></div></div></div>
  <div id="title"></div>
  <div id="creator" class="hidden"></div>
  <div id="loading"><div class="lw"><h1>末世超市</h1><div class="lbar"><i id="lbarI"></i></div><p id="ltxt">正在加载…</p></div></div>
  <div id="rotate"><div><b>请把手机横过来</b><small>末世超市是横屏游戏</small></div></div>
</div>
<script src="game.js?v=4"></script>
</body>
</html>
